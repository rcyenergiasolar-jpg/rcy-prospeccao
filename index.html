 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCY Energia Solar — CRM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
:root{
  --azul:#003F5C;
  --verde:#7AC943;
  --laranja:#FF7A00;
  --vermelho:#E63946;
  --cinza:#95a5a6;
  --bg:#F4F4F4;
  --card:#fff;
  --sombra:0 2px 8px rgba(0,0,0,.12);
  --azul-claro:#E8F0F5;
  --verde-claro:#EAF7E0;
  --laranja-claro:#FFF0E0;
  --vermelho-claro:#FDEAEA;
}
body{background:var(--bg);color:#2c3e50;font-size:14px}
/* Header */
.header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.header-logo{display:flex;align-items:center;gap:10px}
.header-logo img{height:48px;width:auto;object-fit:contain}
.header-logo svg{height:44px;width:auto}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.btn-primary{background:var(--verde);color:#fff}
.btn-primary:hover{background:#5fae2e}
.btn-secondary{background:#fff;color:var(--azul)}
.btn-secondary:hover{background:var(--azul-claro)}
.btn-danger{background:var(--vermelho);color:#fff}
.btn-danger:hover{background:#c1121f}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:8px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;border:none;font-size:16px}
.btn-icon:hover{background:rgba(255,255,255,.3)}
/* Stats */
.stats-bar{display:flex;gap:12px;padding:12px 16px;overflow-x:auto;background:#fff;box-shadow:var(--sombra)}
.stat-card{min-width:110px;padding:10px 14px;border-radius:8px;background:var(--bg);text-align:center}
.stat-card .num{font-size:22px;font-weight:700;color:var(--azul)}
.stat-card .lbl{font-size:11px;color:#7f8c8d;margin-top:2px}
.stat-card.ativos{background:var(--verde-claro)}
.stat-card.ativos .num{color:var(--verde)}
.stat-card.visitas{background:var(--azul-claro)}
.stat-card.visitas .num{color:var(--azul)}
.stat-card.fup{background:var(--laranja-claro)}
.stat-card.fup .num{color:var(--laranja)}
.stat-card.atrasados{background:var(--vermelho-claro)}
.stat-card.atrasados .num{color:var(--vermelho)}
.stat-card.total{background:#eaecee}
.stat-card.arquivados{background:#f2f3f4}
.stat-card.arquivados .num{color:#7f8c8d}
/* Nav */
.nav-tabs{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid #d5dbdb}
.nav-tab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:#7f8c8d;border-bottom:3px solid transparent;border-radius:4px 4px 0 0}
.nav-tab.active{color:var(--azul);border-bottom-color:var(--azul)}
.nav-tab:hover{background:var(--bg)}
/* Filters */
.filters{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap;background:#fff}
.filters select,.filters input{padding:6px 10px;border:1px solid #d5dbdb;border-radius:6px;font-size:13px}
.filters select{background:#fff}
.filter-chip{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent}
.filter-chip.active{border-color:var(--azul);background:var(--azul-claro);color:var(--azul)}
.filter-chip:not(.active){background:var(--bg);color:#7f8c8d}
/* Dashboard */
.view{display:none;padding:16px}
.view.active{display:block}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.dash-card{background:var(--card);border-radius:10px;padding:16px;box-shadow:var(--sombra)}
.dash-card h3{font-size:14px;color:var(--azul);margin-bottom:10px;border-bottom:2px solid var(--bg);padding-bottom:6px;display:flex;align-items:center;gap:6px}
.dash-card .big-num{font-size:32px;font-weight:700;color:var(--azul)}
.dash-card .sub{font-size:12px;color:#7f8c8d;margin-top:4px}
.consultor-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f3f4;align-items:center}
.consultor-row:last-child{border:none}
.consultor-row .nome{font-weight:600}
.consultor-row .qtd{background:var(--bg);padding:2px 10px;border-radius:12px;font-weight:700}
/* Barra de progresso no funil */
.funil-bar{height:22px;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;transition:width .3s;margin-bottom:4px;min-width:30px}
/* Tabela comparativa consultores */
.comp-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.comp-table th{background:var(--bg);padding:6px 8px;text-align:left;font-weight:600;color:#7f8c8d;border-radius:4px}
.comp-table td{padding:6px 8px;border-bottom:1px solid #f0f3f4;text-align:center}
.comp-table td:first-child{text-align:left;font-weight:600}
.comp-table tr:hover{background:var(--azul-claro)}
/* Kanban */
.kanban-board{display:flex;gap:10px;overflow-x:auto;padding-bottom:16px;min-height:500px}
.kanban-col{min-width:220px;max-width:260px;flex-shrink:0;background:#fff;border-radius:10px;box-shadow:var(--sombra);display:flex;flex-direction:column}
.kanban-col-header{padding:10px 12px;border-radius:10px 10px 0 0;font-weight:700;font-size:13px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.kanban-col-body{padding:8px;flex:1;overflow-y:auto;max-height:600px}
.kanban-card{background:var(--bg);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.2s;border-left:4px solid var(--cinza)}
.kanban-card:hover{background:var(--azul-claro);transform:translateY(-2px);box-shadow:var(--sombra)}
.kanban-card .kc-nome{font-weight:700;font-size:13px;margin-bottom:4px}
.kanban-card .kc-info{font-size:11px;color:#7f8c8d;display:flex;flex-wrap:wrap;gap:4px}
.kanban-card .kc-badge{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}
.badge-quente{background:var(--vermelho-claro);color:var(--vermelho)}
.badge-morno{background:var(--laranja-claro);color:var(--laranja)}
.badge-frio{background:var(--azul-claro);color:var(--azul)}
.badge-ativo{background:var(--verde-claro);color:var(--verde)}
.badge-arquivado{background:#f2f3f4;color:#7f8c8d}
.kanban-col-count{background:rgba(255,255,255,.25);padding:1px 8px;border-radius:10px;font-size:12px}
/* Forms */
.form-container{max-width:600px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;box-shadow:var(--sombra)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#7f8c8d;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #d5dbdb;border-radius:6px;font-size:13px}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;margin-top:16px}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:10px;width:100%;max-width:500px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.modal h2{font-size:16px;color:var(--azul);margin-bottom:16px}
.modal-close{float:right;cursor:pointer;font-size:20px;color:#7f8c8d;background:none;border:none}
.modal-close:hover{color:var(--vermelho)}
/* FUP History */
.fup-history{margin-top:12px;border-top:1px solid var(--bg);padding-top:10px}
.fup-item{padding:6px 0;border-bottom:1px solid #f0f3f4;font-size:12px}
.fup-item:last-child{border:none}
.fup-item .fup-n{font-weight:700;color:var(--azul)}
/* Loading */
.loading{display:none;text-align:center;padding:40px;color:#7f8c8d}
.loading.show{display:block}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--bg);border-top-color:var(--azul);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-weight:600;z-index:300;opacity:0;transform:translateY(20px);transition:.3s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--verde)}
.toast.error{background:var(--vermelho)}
/* Responsive */
@media(max-width:768px){
.form-row{grid-template-columns:1fr}
.stats-bar{gap:8px}
.stat-card{min-width:90px}
.kanban-col{min-width:180px}
.header-logo img{height:36px}
.header-logo svg{height:34px}
}
</style>
</head>
<body>

<!-- Header com Logo -->
<div class="header">
  <div class="header-logo" id="header-logo">
    <!-- A SVG da logo será inserida aqui quando você colar o código -->
    <img src="logo.svg" alt="RCY Energia Solar" onerror="this.style.display='none';document.getElementById('header-text').style.display='block'">
    <span id="header-text" style="display:none;font-size:18px;font-weight:700">☀️ RCY CRM</span>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="carregarDoSheets()" title="Recarregar dados">🔄</button>
    <button class="btn btn-secondary btn-sm" onclick="abrirModalLead()">+ Novo Lead</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar">
  <div class="stat-card ativos"><div class="num" id="st-ativos">0</div><div class="lbl">Leads Ativos</div></div>
  <div class="stat-card visitas"><div class="num" id="st-visitas">0</div><div class="lbl">Visitas</div></div>
  <div class="stat-card fup"><div class="num" id="st-fup">0</div><div class="lbl">Em FUP</div></div>
  <div class="stat-card atrasados"><div class="num" id="st-atrasados">0</div><div class="lbl">Atrasados</div></div>
  <div class="stat-card total"><div class="num" id="st-total">0</div><div class="lbl">No CRM</div></div>
  <div class="stat-card arquivados"><div class="num" id="st-arquivados">0</div><div class="lbl">Arquivados</div></div>
</div>

<!-- Nav -->
<div class="nav-tabs">
  <button class="nav-tab active" onclick="trocarView('dashboard',this)">📊 Dashboard</button>
  <button class="nav-tab" onclick="trocarView('kanban',this)">🗂️ Kanban</button>
  <button class="nav-tab" onclick="trocarView('registrar',this)">✏️ Registrar</button>
</div>

<!-- Filters -->
<div class="filters" id="filters">
  <select id="filtroConsultor" onchange="renderTudo()">
    <option value="">Todos os Consultores</option>
  </select>
  <input type="text" id="buscaTexto" placeholder="🔍 Buscar por nome, bairro, telefone..." oninput="renderTudo()" style="flex:1;min-width:200px">
  <div class="filter-chip active" data-filtro="ativos" onclick="setFiltro(this,'ativos')">Ativos</div>
  <div class="filter-chip" data-filtro="arquivados" onclick="setFiltro(this,'arquivados')">Arquivados</div>
  <div class="filter-chip" data-filtro="atrasados" onclick="setFiltro(this,'atrasados')">Atrasados</div>
  <div class="filter-chip" data-filtro="quentes" onclick="setFiltro(this,'quentes')">🔥 Quentes</div>
</div>

<!-- Dashboard View -->
<div class="view active" id="view-dashboard">
  <div class="dashboard-grid" id="dashGrid"></div>
</div>

<!-- Kanban View -->
<div class="view" id="view-kanban">
  <div class="kanban-board" id="kanbanBoard"></div>
</div>

<!-- Registrar View -->
<div class="view" id="view-registrar">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:900px;margin:0 auto">
    <div class="form-container">
      <h3 style="color:var(--azul);margin-bottom:12px">🎯 Cadastrar Novo Lead</h3>
      <div class="form-group"><label>Nome / Empresa *</label><input type="text" id="lead-nome" placeholder="Nome do cliente"></div>
      <div class="form-group"><label>Telefone</label><input type="text" id="lead-tel" placeholder="(93) 99999-9999"></div>
      <div class="form-group"><label>Consultor *</label><select id="lead-cons"></select></div>
      <div class="form-row">
        <div class="form-group"><label>Temperatura</label>
          <select id="lead-temp"><option value="Frio">❄️ Frio</option><option value="Morno">🌤️ Morno</option><option value="Quente">🔥 Quente</option></select>
        </div>
        <div class="form-group"><label>Status</label><input type="text" id="lead-status" placeholder="Ex: Aguardando retorno"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Bairro</label><input type="text" id="lead-bairro" placeholder="Bairro"></div>
        <div class="form-group"><label>Perfil</label>
          <select id="lead-perfil"><option value="">Selecione...</option><option value="Residencial">Residencial</option><option value="Comercial">Comercial</option><option value="Rural">Rural</option><option value="Industrial">Industrial</option></select>
        </div>
      </div>
      <div class="form-group"><label>Etapa</label>
        <select id="lead-etapa"><option value="Prospectado">Prospectado</option><option value="FUP 1">FUP 1</option><option value="FUP 2">FUP 2</option><option value="FUP 3">FUP 3</option><option value="FUP 4">FUP 4</option><option value="FUP 5">FUP 5</option><option value="FUP 6">FUP 6</option><option value="Visita Agendada">Visita Agendada</option></select>
      </div>
      <div class="form-group"><label>Observação</label><textarea id="lead-obs" placeholder="Notas sobre o lead..."></textarea></div>
      <div class="form-actions"><button class="btn btn-primary" onclick="salvarLead()">Cadastrar Lead</button></div>
    </div>
    <div class="form-container">
      <h3 style="color:var(--azul);margin-bottom:12px">🔁 Registrar Followup</h3>
      <div class="form-group"><label>Lead *</label><select id="fup-lead" onchange="preencherDadosLead()"></select></div>
      <div class="form-row">
        <div class="form-group"><label>Nome</label><input type="text" id="fup-nome" readonly style="background:var(--bg)"></div>
        <div class="form-group"><label>Telefone</label><input type="text" id="fup-tel" readonly style="background:var(--bg)"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Nº FUP</label><input type="number" id="fup-num" min="1" value="1"></div>
        <div class="form-group"><label>Canal</label>
          <select id="fup-canal"><option value="WhatsApp">WhatsApp</option><option value="Ligação">Ligação</option><option value="Visita">Visita</option><option value="E-mail">E-mail</option><option value="Instagram">Instagram</option></select>
        </div>
      </div>
      <div class="form-group"><label>Status do FUP</label>
        <select id="fup-status"><option value="Agendado">Agendado</option><option value="Realizado">Realizado</option><option value="Sem Resposta">Sem Resposta</option><option value="Remarcado">Remarcado</option></select>
      </div>
      <div class="form-group"><label>Próximo Contato</label><input type="date" id="fup-prox"></div>
      <div class="form-group"><label>Resposta do Lead</label><textarea id="fup-resp" placeholder="O que o lead respondeu?"></textarea></div>
      <div class="form-actions"><button class="btn btn-primary" onclick="salvarFup()">Registrar FUP</button></div>
    </div>
  </div>
</div>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p style="margin-top:12px">Carregando dados do Google Sheets...</p>
</div>

<!-- Modal Editar Lead -->
<div class="modal-overlay" id="modal-editar">
  <div class="modal">
    <button class="modal-close" onclick="fecharModal('modal-editar')">&times;</button>
    <h2>✏️ Editar Lead</h2>
    <input type="hidden" id="edit-id">
    <div class="form-group"><label>Nome *</label><input type="text" id="edit-nome"></div>
    <div class="form-group"><label>Telefone</label><input type="text" id="edit-tel"></div>
    <div class="form-group"><label>Consultor</label><select id="edit-cons"></select></div>
    <div class="form-row">
      <div class="form-group"><label>Temperatura</label>
        <select id="edit-temp"><option value="Frio">❄️ Frio</option><option value="Morno">🌤️ Morno</option><option value="Quente">🔥 Quente</option></select>
      </div>
      <div class="form-group"><label>Bairro</label><input type="text" id="edit-bairro"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Perfil</label>
        <select id="edit-perfil"><option value="">Selecione...</option><option value="Residencial">Residencial</option><option value="Comercial">Comercial</option><option value="Rural">Rural</option><option value="Industrial">Industrial</option></select>
      </div>
      <div class="form-group"><label>Etapa</label>
        <select id="edit-etapa"><option value="Prospectado">Prospectado</option><option value="FUP 1">FUP 1</option><option value="FUP 2">FUP 2</option><option value="FUP 3">FUP 3</option><option value="FUP 4">FUP 4</option><option value="FUP 5">FUP 5</option><option value="FUP 6">FUP 6</option><option value="Visita Agendada">Visita Agendada</option></select>
      </div>
    </div>
    <div class="form-group"><label>Observação</label><textarea id="edit-obs"></textarea></div>
    <div class="form-actions">
      <button class="btn btn-danger btn-sm" onclick="arquivarLead()">Arquivar</button>
      <button class="btn btn-secondary" onclick="fecharModal('modal-editar')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEdicaoLead()">Salvar</button>
    </div>
    <div class="fup-history" id="fup-history"></div>
  </div>
</div>

<!-- Modal Followup -->
<div class="modal-overlay" id="modal-fup">
  <div class="modal">
    <button class="modal-close" onclick="fecharModal('modal-fup')">&times;</button>
    <h2>📞 Followup</h2>
    <input type="hidden" id="mfup-id">
    <div class="form-group"><label>Lead</label><input type="text" id="mfup-nome" readonly style="background:var(--bg)"></div>
    <div class="form-row">
      <div class="form-group"><label>Nº FUP</label><input type="number" id="mfup-num" min="1" value="1"></div>
      <div class="form-group"><label>Canal</label>
        <select id="mfup-canal"><option value="WhatsApp">WhatsApp</option><option value="Ligação">Ligação</option><option value="Visita">Visita</option><option value="E-mail">E-mail</option><option value="Instagram">Instagram</option></select>
      </div>
    </div>
    <div class="form-group"><label>Status</label>
      <select id="mfup-status"><option value="Agendado">Agendado</option><option value="Realizado">Realizado</option><option value="Sem Resposta">Sem Resposta</option><option value="Remarcado">Remarcado</option></select>
    </div>
    <div class="form-group"><label>Próximo Contato</label><input type="date" id="mfup-prox"></div>
    <div class="form-group"><label>Resposta</label><textarea id="mfup-resp" placeholder="Resposta do lead..."></textarea></div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="fecharModal('modal-fup')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarFupModal()">Registrar FUP</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-m4rgkKNz0DD6s734KUxU5r5FesqDbzCHxJYvHJ7C-JqWJ_MF8HcXwvo6A4z5JRzDjA/exec';
var estado = {leads:[],consultores:[],filtroAtual:'ativos',carregando:false};

function carregarDoSheets(){
  estado.carregando=true;mostrarLoading(true);
  var url=SCRIPT_URL+'?acao=lerTudo&_='+Date.now();
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.ok){
      estado.leads=data.leads||[];estado.consultores=data.consultores||[];
      try{localStorage.setItem('rcy_cache',JSON.stringify({leads:estado.leads,consultores:estado.consultores,ts:Date.now()}))}catch(e){}
      renderTudo();showToast('Dados carregados! '+estado.leads.length+' leads.','success');
    }else{throw new Error(data.erro||'Erro ao carregar')}
  }).catch(function(err){
    try{var cache=JSON.parse(localStorage.getItem('rcy_cache')||'{}');
      if(cache.leads&&cache.leads.length){estado.leads=cache.leads;estado.consultores=cache.consultores||[];renderTudo();showToast('Sem conexão. Cache local ('+estado.leads.length+' leads).','error')}
      else{showToast('Erro: '+err.message,'error')}
    }catch(e2){showToast('Erro: '+err.message,'error')}
  }).finally(function(){estado.carregando=false;mostrarLoading(false)})
}

function enviarParaSheets(params){
  return fetch(SCRIPT_URL+'?'+params+'&_='+Date.now()).then(function(r){return r.json()}).then(function(data){if(!data.ok)throw new Error(data.erro||'Erro');return data})
}

function salvarLead(){
  var nome=document.getElementById('lead-nome').value.trim();
  if(!nome){showToast('Preencha o nome!','error');return}

function renderTudo(){renderStats();renderDashboard();renderKanban();preencherSelects()}

function getLeadsFiltrados(){
  var cons=document.getElementById('filtroConsultor').value;
  var busca=(document.getElementById('buscaTexto').value||'').toLowerCase();
  var filtro=estado.filtroAtual;
  return estado.leads.filter(function(l){
    if(cons&&l.cons!==cons)return false;
    if(busca){var texto=(l.nome+' '+l.bairro+' '+l.tel+' '+l.cons+' '+l.obs).toLowerCase();if(texto.indexOf(busca)===-1)return false}
    if(filtro==='arquivados'){if(l.situacao!=='arquivado')return false}
    else if(filtro==='ativos'){if(l.situacao==='arquivado')return false}
    else if(filtro==='atrasados'){if(l.situacao==='arquivado')return false;var temAtrasado=false;if(l.fups&&l.fups.length){l.fups.forEach(function(f){if(f.prox){var d=new Date(f.prox);if(d<new Date()&&f.st!=='Realizado')temAtrasado=true}})}if(!temAtrasado)return false}
    else if(filtro==='quentes'){if(l.situacao==='arquivado')return false;if(l.temp!=='Quente')return false}
    return true
  })
}

function renderStats(){
  var ativos=estado.leads.filter(function(l){return l.situacao!=='arquivado'});
  var arquivados=estado.leads.filter(function(l){return l.situacao==='arquivado'});
  var visitas=ativos.filter(function(l){return l.etapa==='Visita Agendada'});
  var emFup=ativos.filter(function(l){return l.etapa&&l.etapa.indexOf('FUP')===0});
  var atrasados=0;
  ativos.forEach(function(l){if(l.fups)l.fups.forEach(function(f){if(f.prox){var d=new Date(f.prox);if(d<new Date()&&f.st!=='Realizado')atrasados++}})});
  document.getElementById('st-ativos').textContent=ativos.length;
  document.getElementById('st-visitas').textContent=visitas.length;
  document.getElementById('st-fup').textContent=emFup.length;
  document.getElementById('st-atrasados').textContent=atrasados;
  document.getElementById('st-total').textContent=estado.leads.length;
  document.getElementById('st-arquivados').textContent=arquivados.length;
}

function renderDashboard(){
  var grid=document.getElementById('dashGrid');
  var ativos=estado.leads.filter(function(l){return l.situacao!=='arquivado'});
  var etapas=['Prospectado','FUP 1','FUP 2','FUP 3','FUP 4','FUP 5','FUP 6','Visita Agendada'];
  var coresFunil=['#003F5C','#7AC943','#FF7A00','#9b59b6','#1abc9c','#f39c12','#E63946','#27ae60'];
  var html='';

  // Card 1: Visão Geral
  html+='<div class="dash-card"><h3>📊 Visão Geral</h3><div class="big-num">'+ativos.length+'</div><div class="sub">Leads ativos no CRM</div><div style="margin-top:12px;font-size:13px;display:flex;flex-direction:column;gap:4px"><div>🔥 Quentes: <b>'+ativos.filter(function(l){return l.temp==='Quente'}).length+'</b></div><div>🌤️ Mornos: <b>'+ativos.filter(function(l){return l.temp==='Morno'}).length+'</b></div><div>❄️ Frios: <b>'+ativos.filter(function(l){return l.temp==='Frio'}).length+'</b></div></div></div>';

  // Card 2: Comparativo de Consultores
  html+='<div class="dash-card"><h3>👥 Comparativo de Consultores</h3>';
  if(estado.consultores.length===0){html+='<div class="sub">Nenhum consultor cadastrado.</div>'}
  else{
    html+='<table class="comp-table"><thead><tr><th>Consultor</th><th>Leads</th><th>🔥 Quentes</th><th>🏠 Visitas</th><th>📞 FUPs</th><th>⏰ Atrasados</th></tr></thead><tbody>';
    estado.consultores.forEach(function(c){
      var leadsCons=ativos.filter(function(l){return l.cons===c});
      var quentes=leadsCons.filter(function(l){return l.temp==='Quente'}).length;
      var visitas=leadsCons.filter(function(l){return l.etapa==='Visita Agendada'}).length;
      var emFup=leadsCons.filter(function(l){return l.etapa&&l.etapa.indexOf('FUP')===0}).length;
      var atrasados=0;
      leadsCons.forEach(function(l){if(l.fups)l.fups.forEach(function(f){if(f.prox){var d=new Date(f.prox);if(d<new Date()&&f.st!=='Realizado')atrasados++}})});
      html+='<tr><td>'+c+'</td><td>'+leadsCons.length+'</td><td style="color:var(--vermelho);font-weight:700">'+quentes+'</td><td style="color:var(--verde);font-weight:700">'+visitas+'</td><td style="color:var(--laranja);font-weight:700">'+emFup+'</td><td style="color:var(--vermelho);font-weight:700">'+atrasados+'</td></tr>';
    });
    var totalQuentes=ativos.filter(function(l){return l.temp==='Quente'}).length;
    var totalVisitas=ativos.filter(function(l){return l.etapa==='Visita Agendada'}).length;
    var totalFup=ativos.filter(function(l){return l.etapa&&l.etapa.indexOf('FUP')===0}).length;
    var totalAtrasados=0;
    ativos.forEach(function(l){if(l.fups)l.fups.forEach(function(f){if(f.prox){var d=new Date(f.prox);if(d<new Date()&&f.st!=='Realizado')totalAtrasados++}})});
    html+='<tr style="border-top:2px solid var(--azul);font-weight:700;background:var(--bg)"><td>TOTAL</td><td>'+ativos.length+'</td><td style="color:var(--vermelho)">'+totalQuentes+'</td><td style="color:var(--verde)">'+totalVisitas+'</td><td style="color:var(--laranja)">'+totalFup+'</td><td style="color:var(--vermelho)">'+totalAtrasados+'</td></tr>';
    html+='</tbody></table>';
  }
  html+='</div>';

  // Card 3: Funil de Vendas
  html+='<div class="dash-card"><h3>🔄 Funil de Vendas</h3>';
  var maxEtapa=1;
  etapas.forEach(function(e){var count=ativos.filter(function(l){return l.etapa===e}).length;if(count>maxEtapa)maxEtapa=count});
  etapas.forEach(function(e,idx){
    var count=ativos.filter(function(l){return l.etapa===e}).length;
    var pct=maxEtapa>0?Math.round(count/maxEtapa*100):0;
    var pctTotal=ativos.length>0?Math.round(count/ativos.length*100):0;
    html+='<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="font-weight:600">'+e+'</span><span>'+count+' ('+pctTotal+'%)</span></div><div style="background:var(--bg);border-radius:6px;overflow:hidden;height:22px"><div class="funil-bar" style="width:'+Math.max(pct,count>0?15:0)+'%;background:'+coresFunil[idx]+'">'+(count>0?count:'')+'</div></div></div>';
  });
  html+='</div>';

  // Card 4: Alertas FUP
  var alertas=[];
  ativos.forEach(function(l){if(l.fups)l.fups.forEach(function(f){if(f.prox){var d=new Date(f.prox);if(d<new Date()&&f.st!=='Realizado')alertas.push({lead:l,fup:f})}})});
  html+='<div class="dash-card"><h3>⚠️ Alertas FUP Atrasados</h3>';
  if(alertas.length===0){html+='<div class="sub">Nenhum FUP atrasado! ✅</div>'}
  else{
    html+='<div class="sub" style="margin-bottom:8px">'+alertas.length+' followup(s) atrasado(s)</div>';
    alertas.slice(0,10).forEach(function(a){
      var diasAtraso=Math.floor((new Date()-new Date(a.fup.prox))/(1000*60*60*24));
      html+='<div class="consultor-row"><div><span class="nome" style="font-size:13px">'+a.lead.nome+'</span><div style="font-size:11px;color:#7f8c8d">👤 '+a.lead.cons+' • FUP '+a.fup.n+' • '+diasAtraso+' dia(s) de atraso</div></div><span class="qtd" style="background:var(--vermelho-claro);color:var(--vermelho);font-size:11px">'+a.fup.prox+'</span></div>';
    });
  }
  html+='</div>';
  grid.innerHTML=html;
}

function renderKanban(){
  var board=document.getElementById('kanbanBoard');
  var leads=getLeadsFiltrados();
  var etapas=['Prospectado','FUP 1','FUP 2','FUP 3','FUP 4','FUP 5','FUP 6','Visita Agendada'];
  var cores=['#003F5C','#7AC943','#FF7A00','#9b59b6','#1abc9c','#f39c12','#E63946','#27ae60'];
  var html='';
  etapas.forEach(function(etapa,idx){
    var leadsEtapa=leads.filter(function(l){return l.etapa===etapa});
    html+='<div class="kanban-col"><div class="kanban-col-header" style="background:'+cores[idx]+'"><span>'+etapa+'</span><span class="kanban-col-count">'+leadsEtapa.length+'</span></div><div class="kanban-col-body">';
    leadsEtapa.forEach(function(l){
      var tempClass=l.temp==='Quente'?'badge-quente':l.temp==='Morno'?'badge-morno':'badge-frio';
      var sitClass=l.situacao==='arquivado'?'badge-arquivado':'badge-ativo';
      var fupCount=l.fups?l.fups.length:0;
      html+='<div class="kanban-card" onclick="abrirModalEditar(\''+l.id+'\')" style="border-left-color:'+cores[idx]+'"><div class="kc-nome">'+l.nome+'</div><div class="kc-info"><span class="kc-badge '+tempClass+'">'+(l.temp||'Frio')+'</span><span class="kc-badge '+sitClass+'">'+(l.situacao==='arquivado'?'Arquivado':'Ativo')+'</span>'+(fupCount>0?'<span>📞 '+fupCount+' FUP</span>':'')+(l.bairro?'<span>📍 '+l.bairro+'</span>':'')+(l.cons?'<span>👤 '+l.cons+'</span>':'')+'</div></div>';
    });
    html+='</div></div>';
  });
  board.innerHTML=html;
}

function abrirModalLead(){trocarView('registrar',document.querySelector('.nav-tab:last-child'));document.getElementById('lead-nome').focus()}

function abrirModalEditar(id){
  var lead=estado.leads.find(function(l){return l.id===id});if(!lead)return;
  document.getElementById('edit-id').value=lead.id;
  document.getElementById('edit-nome').value=lead.nome||'';
  document.getElementById('edit-tel').value=lead.tel||'';
  document.getElementById('edit-bairro').value=lead.bairro||'';
  document.getElementById('edit-obs').value=lead.obs||'';
  setSelect('edit-cons',lead.cons);setSelect('edit-temp',lead.temp);setSelect('edit-perfil',lead.perfil);setSelect('edit-etapa',lead.etapa);
  var histHtml='';
  if(lead.fups&&lead.fups.length){
    histHtml='<div class="fup-history"><h3 style="font-size:13px;color:var(--azul);margin-bottom:8px">📞 Histórico de Followups</h3>';
    lead.fups.forEach(function(f){histHtml+='<div class="fup-item"><span class="fup-n">FUP '+f.n+'</span> — '+(f.canal||'')+' | '+(f.st||'')+(f.prox?' | Próx: '+f.prox:'')+(f.resp?'<br>💬 '+f.resp:'')+(f.data?'<br>📅 '+f.data:'')+'</div>'});
    histHtml+='</div>';
  }
  document.getElementById('fup-history').innerHTML=histHtml;
  document.getElementById('modal-editar').classList.add('show');
}

function abrirModalFup(id){
  var lead=estado.leads.find(function(l){return l.id===id});if(!lead)return;
  document.getElementById('mfup-id').value=lead.id;
  document.getElementById('mfup-nome').value=lead.nome;
  document.getElementById('mfup-num').value=(lead.fups?lead.fups.length+1:1);
  document.getElementById('mfup-canal').value='WhatsApp';
  document.getElementById('mfup-status').value='Agendado';
  document.getElementById('mfup-prox').value='';
  document.getElementById('mfup-resp').value='';
  document.getElementById('modal-fup').classList.add('show');
}

function fecharModal(id){document.getElementById(id).classList.remove('show')}

function preencherSelects(){
  var consOptions='<option value="">Todos os Consultores</option>';
  estado.consultores.forEach(function(c){consOptions+='<option value="'+c+'">'+c+'</option>'});
  document.getElementById('filtroConsultor').innerHTML=consOptions;
  ['lead-cons','edit-cons'].forEach(function(id){var sel=document.getElementById(id);if(!sel)return;var current=sel.value;var opts='';estado.consultores.forEach(function(c){opts+='<option value="'+c+'">'+c+'</option>'});sel.innerHTML=opts;if(current)sel.value=current});
  var fupSel=document.getElementById('fup-lead');
  if(fupSel){var currentFup=fupSel.value;var opts='<option value="">Selecione um lead...</option>';estado.leads.filter(function(l){return l.situacao!=='arquivado'}).forEach(function(l){opts+='<option value="'+l.id+'">'+l.id+' — '+l.nome+' ('+l.cons+')</option>'});fupSel.innerHTML=opts;if(currentFup)fupSel.value=currentFup}
}

function preencherDadosLead(){
  var id=document.getElementById('fup-lead').value;
  var lead=estado.leads.find(function(l){return l.id===id});
  if(lead){document.getElementById('fup-nome').value=lead.nome||'';document.getElementById('fup-tel').value=lead.tel||'';document.getElementById('fup-num').value=(lead.fups?lead.fups.length+1:1)}
}

function setSelect(id,val){var sel=document.getElementById(id);if(!sel)return;for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===val){sel.selectedIndex=i;return}}}

function trocarView(nome,btn){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});document.getElementById('view-'+nome).classList.add('active');document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active')});if(btn)btn.classList.add('active')}
function setFiltro(el,filtro){estado.filtroAtual=filtro;document.querySelectorAll('.filter-chip').forEach(function(c){c.classList.remove('active')});el.classList.add('active');renderTudo()}
function limparFormLead(){['lead-nome','lead-tel','lead-status','lead-bairro','lead-obs'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('lead-temp').value='Frio';document.getElementById('lead-perfil').value='';document.getElementById('lead-etapa').value='Prospectado'}
function limparFormFup(){document.getElementById('fup-lead').value='';document.getElementById('fup-nome').value='';document.getElementById('fup-tel').value='';document.getElementById('fup-num').value='1';document.getElementById('fup-canal').value='WhatsApp';document.getElementById('fup-status').value='Agendado';document.getElementById('fup-prox').value='';document.getElementById('fup-resp').value=''}
function mostrarLoading(show){var el=document.getElementById('loading');if(el)el.classList.toggle('show',show)}
function showToast(msg,tipo){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(tipo||'success')+' show';setTimeout(function(){t.classList.remove('show')},3500)}

document.addEventListener('DOMContentLoaded',function(){carregarDoSheets();setInterval(function(){if(!estado.carregando)carregarDoSheets()},60000)});
</script>
